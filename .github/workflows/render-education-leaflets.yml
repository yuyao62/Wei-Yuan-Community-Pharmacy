name: Render medication education PNGs
on:
  push:
    paths:
      - 'assets/verified-*-leaflet.svg'
      - '.github/workflows/render-education-leaflets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG renderer and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - name: Render corrected leaflets
        run: |
          set -eu
          rsvg-convert -w 1200 -h 1590 assets/verified-insulin-leaflet.svg > insulin-pen-detailed.png
          rsvg-convert -w 1200 -h 1590 assets/verified-special-leaflet.svg > special-dosage-detailed.png
          rsvg-convert -w 1200 -h 1590 assets/verified-nose-leaflet.svg > '鼻噴劑正確使用完整圖解.png'
          rsvg-convert -w 1200 -h 1590 assets/verified-ear-leaflet.svg > ear-drops-detailed.png
          rsvg-convert -w 1200 -h 1590 assets/verified-asthma-leaflet.svg > asthma-inhaler-detailed.png
          rsvg-convert -w 1200 -h 1590 assets/verified-eye-leaflet.svg > eye-medicine-detailed.png
      - name: Commit updated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insulin-pen-detailed.png special-dosage-detailed.png '鼻噴劑正確使用完整圖解.png' ear-drops-detailed.png asthma-inhaler-detailed.png eye-medicine-detailed.png
          if ! git diff --cached --quiet; then
            git commit -m "Render corrected six medication education PNGs"
            git push
          fi
