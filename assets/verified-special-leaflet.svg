<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1590" viewBox="0 0 1200 1590"><rect width="1200" height="1590" rx="24" fill="#f9fbf8"/><rect x="18" y="18" width="1164" height="1553" rx="27" fill="white" stroke="#b2d5bb" stroke-width="4"/><rect x="18" y="18" width="1164" height="170" rx="26" fill="#205d43"/><rect x="18" y="160" width="1164" height="25" fill="#205d43"/><circle cx="98" cy="100" r="47" fill="#72bb83"/><path d="M98 67v66M65 100h66" stroke="white" stroke-width="15" stroke-linecap="round"/><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="178" y="98" font-size="48" font-weight="bold" fill="#fff">維元社區藥局</text><text x="180" y="140" font-size="23" fill="#cbe8d0">藥師用藥衛教  •  Wei-Yuan Community Pharmacy</text><text x="600" y="236" font-size="54" text-anchor="middle" font-weight="bold" fill="#20543b">貼片與特殊劑型｜完整圖解</text><text x="600" y="274" font-size="25" text-anchor="middle" fill="#527964">不同劑型方法不同，請先核對藥袋</text><g><rect x="34" y="292" width="552" height="347" rx="25" fill="#f1f8f0" stroke="#c6e0ce" stroke-width="3"/><circle cx="79" cy="338" r="30" fill="#31825a"/><text x="79" y="349" text-anchor="middle" font-size="32" font-weight="bold" fill="white">1</text><text x="124" y="350" font-weight="bold" font-size="31" fill="#20533a">確認劑型</text><g transform="translate(154 334) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><rect x="30" y="30" width="88" height="104" rx="15" fill="#b8e1dc" stroke="#30775a" stroke-width="6"/><circle cx="74" cy="80" r="24" fill="white"/><path d="M61 79l11 11 18-23" stroke="#44a26c" stroke-width="6" fill="none"/></g></g><text x="60" y="564" font-size="23" fill="#456a57">貼片、栓劑、舌下錠等</text><text x="60" y="598" font-size="23" fill="#456a57">使用途徑不可互換</text></g><g><rect x="604" y="292" width="552" height="347" rx="25" fill="#f5f9f2" stroke="#c6e0ce" stroke-width="3"/><circle cx="649" cy="338" r="30" fill="#31825a"/><text x="649" y="349" text-anchor="middle" font-size="32" font-weight="bold" fill="white">2</text><text x="694" y="350" font-weight="bold" font-size="31" fill="#20533a">貼片選擇部位</text><g transform="translate(724 334) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><circle cx="76" cy="78" r="51" fill="#f5d4b8" stroke="#a67d61" stroke-width="6"/><path d="M48 81q29-34 57 0q-29 34-57 0" fill="white" stroke="#447960" stroke-width="5"/><circle cx="77" cy="81" r="13" fill="#5f9985"/></g></g><text x="630" y="564" font-size="23" fill="#456a57">選擇產品指定皮膚區域</text><text x="630" y="598" font-size="23" fill="#456a57">皮膚清潔、乾燥且完整</text></g><g><rect x="34" y="662" width="552" height="347" rx="25" fill="#f1f8f0" stroke="#c6e0ce" stroke-width="3"/><circle cx="79" cy="708" r="30" fill="#31825a"/><text x="79" y="719" text-anchor="middle" font-size="32" font-weight="bold" fill="white">3</text><text x="124" y="720" font-weight="bold" font-size="31" fill="#20533a">貼片使用</text><g transform="translate(154 704) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><path d="M35 80h82" stroke="#2c7c5c" stroke-width="8"/><rect x="48" y="25" width="56" height="102" rx="12" fill="#add9e1" stroke="#2c7c5c" stroke-width="5"/><rect x="57" y="13" width="36" height="17" rx="5" fill="white" stroke="#2c7c5c" stroke-width="4"/></g></g><text x="60" y="934" font-size="23" fill="#456a57">依仿單黏貼並輪替位置</text><text x="60" y="968" font-size="23" fill="#456a57">不可自行裁切或加熱</text></g><g><rect x="604" y="662" width="552" height="347" rx="25" fill="#f5f9f2" stroke="#c6e0ce" stroke-width="3"/><circle cx="649" cy="708" r="30" fill="#31825a"/><text x="649" y="719" text-anchor="middle" font-size="32" font-weight="bold" fill="white">4</text><text x="694" y="720" font-weight="bold" font-size="31" fill="#20533a">栓劑使用</text><g transform="translate(724 704) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><circle cx="77" cy="80" r="52" fill="#ebf4e9" stroke="#42896b" stroke-width="7"/><path d="M77 45v36l28 18" stroke="#42896b" stroke-width="7" fill="none"/></g></g><text x="630" y="934" font-size="23" fill="#456a57">確認直腸或陰道用途</text><text x="630" y="968" font-size="23" fill="#456a57">依藥師指導操作</text></g><g><rect x="34" y="1032" width="552" height="347" rx="25" fill="#f1f8f0" stroke="#c6e0ce" stroke-width="3"/><circle cx="79" cy="1078" r="30" fill="#31825a"/><text x="79" y="1089" text-anchor="middle" font-size="32" font-weight="bold" fill="white">5</text><text x="124" y="1090" font-weight="bold" font-size="31" fill="#20533a">舌下錠使用</text><g transform="translate(154 1074) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><path d="M15 125q34-52 64-53q32 0 56 53" fill="#9fd6bd" stroke="#447c62" stroke-width="6"/><circle cx="76" cy="48" r="32" fill="#efc8a9" stroke="#a67c60" stroke-width="4"/></g></g><text x="60" y="1304" font-size="23" fill="#456a57">僅限標示舌下使用者</text><text x="60" y="1338" font-size="23" fill="#456a57">勿任意吞服或咀嚼</text></g><g><rect x="604" y="1032" width="552" height="347" rx="25" fill="#f5f9f2" stroke="#c6e0ce" stroke-width="3"/><circle cx="649" cy="1078" r="30" fill="#31825a"/><text x="649" y="1089" text-anchor="middle" font-size="32" font-weight="bold" fill="white">6</text><text x="694" y="1090" font-weight="bold" font-size="31" fill="#20533a">保存與丟棄</text><g transform="translate(724 1074) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><rect x="41" y="40" width="72" height="93" rx="10" fill="#faecc5" stroke="#9b9b64" stroke-width="5"/><path d="M55 82l15 15 33-33" fill="none" stroke="#3c9971" stroke-width="8"/></g></g><text x="630" y="1304" font-size="23" fill="#456a57">依個別產品保存</text><text x="630" y="1338" font-size="23" fill="#456a57">用過貼片妥善處理</text></g><rect x="34" y="1414" width="1132" height="64" rx="17" fill="#e8f5e9"/><text x="55" y="1457" font-size="25" font-weight="bold" fill="#226846">不可自行更改給藥途徑或劑量</text><rect x="34" y="1487" width="1132" height="64" rx="17" fill="#fff1e1"/><text x="55" y="1528" font-size="23" fill="#8b5b32">本單張非所有特殊劑型的共同操作說明。</text></g></svg>