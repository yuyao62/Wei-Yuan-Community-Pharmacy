font-size="31" fill="#20533a">準備滴耳藥</text><g transform="translate(724 334) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><rect x="44" y="20" width="55" height="96" rx="12" fill="#b9e1dc" stroke="#34745b" stroke-width="5"/><path d="M54 112h34l-17 27Z" fill="white" stroke="#34745b" stroke-width="4"/></g></g><text x="630" y="564" font-size="23" fill="#456a57">若仿單允許，可手握回溫</text><text x="630" y="598" font-size="23" fill="#456a57">不自行加熱藥液</text></g><g><rect x="34" y="662" width="552" height="347" rx="25" fill="#f1f8f0" stroke="#c6e0ce" stroke-width="3"/><circle cx="79" cy="708" r="30" fill="#31825a"/><text x="79" y="719" text-anchor="middle" font-size="32" font-weight="bold" fill="white">3</text><text x="124" y="720" font-weight="bold" font-size="31" fill="#20533a">側躺讓患耳朝上</text><g transform="translate(154 704) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><rect x="0" y="114" width="141" height="38" rx="17" fill="#c7e3ec"/><path d="M37 78Q50 22 94 32Q125 42 111 89Q99 122 65 123Q38 115 37 78" fill="#efc9ab" stroke="#9d765d" stroke-width="4"/><path d="M68 58Q93 39 98 66Q105 88 83 94" fill="none" stroke="#ab7555" stroke-width="5"/></g></g><text x="60" y="934" font-size="23" fill="#456a57">將需要滴藥的耳朵朝上</text><text x="60" y="968" font-size="23" fill="#456a57">依年齡及指示調整耳廓</text></g><g><rect x="604" y="662" width="552" height="347" rx="25" fill="#f5f9f2" stroke="#c6e0ce" stroke-width="3"/><circle cx="649" cy="708" r="30" fill="#31825a"/><text x="649" y="719" text-anchor="middle" font-size="32" font-weight="bold" fill="white">4</text><text x="694" y="720" font-weight="bold" font-size="31" fill="#20533a">滴入規定滴數</text><g transform="translate(724 704) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><path d="M30 94Q42 29 89 31Q129 40 113 93Q95 134 51 115" fill="#f3c9aa" stroke="#a07658" stroke-width="5"/><path d="M73 51q28-13 30 17q0 17-18 23" fill="none" stroke="#a07658" stroke-width="5"/><path d="M110 22l21 15-13 25" fill="none" stroke="#2f8871" stroke-width="6"/></g></g><text x="630" y="934" font-size="23" fill="#456a57">瓶口不接觸耳朵或皮膚</text><text x="630" y="968" font-size="23" fill="#456a57">依醫囑滴入處方量</text></g><g><rect x="34" y="1032" width="552" height="347" rx="25" fill="#f1f8f0" stroke="#c6e0ce" stroke-width="3"/><circle cx="79" cy="1078" r="30" fill="#31825a"/><text x="79" y="1089" text-anchor="middle" font-size="32" font-weight="bold" fill="white">5</text><text x="124" y="1090" font-weight="bold" font-size="31" fill="#20533a">繼續保持側躺</text><g transform="translate(154 1074) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><rect x="0" y="116" width="140" height="38" rx="16" fill="#d5ecf4"/><path d="M22 80Q44 31 87 39Q120 47 116 87Q109 127 53 129" fill="#f2c6a2" stroke="#a87551" stroke-width="5"/><circle cx="115" cy="45" r="30" fill="#fff" stroke="#42916d" stroke-width="5"/><path d="M115 25v21l13 8" stroke="#42916d" stroke-width="5" fill="none"/></g></g><text x="60" y="1304" font-size="23" fill="#456a57">本藥局示範 10～15 分鐘</text><text x="60" y="1338" font-size="23" fill="#456a57">實際依藥品仿單與醫囑</text></g><g><rect x="604" y="1032" width="552" height="347" rx="25" fill="#f5f9f2" stroke="#c6e0ce" stroke-width="3"/><circle cx="649" cy="1078" r="30" fill="#31825a"/><text x="649" y="1089" text-anchor="middle" font-size="32" font-weight="bold" fill="white">6</text><text x="694" y="1090" font-weight="bold" font-size="31" fill="#20533a">清潔與蓋緊</text><g transform="translate(724 1074) scale(1.05)"><g transform="translate(335 76) scale(1.1)"><rect x="36" y="23" width="71" height="115" rx="10" fill="#b3dfe0" stroke="#2a775d" stroke-width="5"/><rect x="48" y="10" width="48" height="19" rx="5" fill="white" stroke="#2a775d" stroke-width="4"/></g></g><text x="630" y="1304" font-size="23" fill="#456a57">擦拭瓶口並蓋緊</text><text x="630" y="1338" font-size="23" fill="#456a57">不與他人共用耳滴劑</text></g><rect x="34" y="1414" width="1132" height="64" rx="17" fill="#e8f5e9"/><text x="55" y="1457" font-size="25" font-weight="bold" fill="#226846">耳膜穿孔或曾接受耳部手術，先詢問醫師</text><rect x="34" y="1487" width="1132" height="64" rx="17" fill="#fff1e1"/><text x="55" y="1528" font-size="23" fill="#8b5b32">側躺時間並非所有耳滴劑通用；以個別處方為準。</text></g></svg>