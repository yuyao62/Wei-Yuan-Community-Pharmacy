<rect x="42" y="881" width="676" height="97" rx="14" fill="#fff4df" stroke="#edd4a9" stroke-width="2"/>
<text x="62" y="912" font-size="23" font-family="sans-serif" font-weight="bold" fill="#805624">用藥安全提醒</text>
<text x="62" y="942" font-size="19" font-family="sans-serif" fill="#664d2c">耳膜穿孔、耳部手術史或滴藥後劇痛、暈眩，請先詢問醫療人員。</text>
<text x="62" y="964" font-size="17" font-family="sans-serif" fill="#77674f">實際使用方式以藥袋、藥品仿單及醫師／藥師指示為準。</text>
