<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030"><rect width="760" height="1030" rx="25" fill="#f6faf6"/><rect x="18" y="18" width="724" height="994" rx="22" fill="white" stroke="#c8e2d0" stroke-width="3"/><rect x="18" y="18" width="724" height="155" rx="21" fill="#205842"/><path d="M18 142H742V173H18Z" fill="#205842"/><rect x="43" y="44" width="57" height="57" rx="13" fill="#83bd8b"/><path d="M72 55v35M54 73h36" stroke="white" stroke-width="9" stroke-linecap="round"/><g font-family="sans-serif"><text x="119" y="77" font-size="32" font-weight="bold" fill="white">維元社區藥局</text><text x="119" y="109" font-size="18" fill="#d9ebda">藥師用藥衛教</text><text x="42" y="157" font-size="24" font-weight="bold" fill="white">眼藥水／眼藥膏</text><text x="380" y="222" font-size="35" font-weight="bold" text-anchor="middle" fill="#205842">眼藥水／眼藥膏圖解</text><text x="380" y="260" font-size="21" text-anchor="middle" fill="#637d6d">滴嘴不碰觸眼睛</text><rect x="42" y="286" width="329" height="277" rx="18" fill="#f0f7f0" stroke="#c7e0cb" stroke-width="2"/><circle cx="75" cy="320" r="23" fill="#347b51"/><text x="75" y="329" font-size="27" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="111" y="330" font-size="24" font-weight="bold" fill="#1d5338">洗手核對左右眼</text><g transform="translate(97 332) scale(0.70)"><g transform="translate(35 65)"><path d="M14 106q85-91 178 0-90 91-178 0" fill="#fff" stroke="#426e58" stroke-width="8"/><circle cx="106" cy="106" r="41" fill="#93c6b2" stroke="#426e58" stroke-width="5"/><circle cx="106" cy="106" r="22" fill="#2b6856"/><path d="M45 34l30 25 M146 35l-22 28" stroke="#5b9478" stroke-width="5"/></g></g><text x="207" y="544" font-size="18" text-anchor="middle" fill="#47745a">藥水滴入下眼瞼囊</text><rect x="389" y="286" width="329" height="277" rx="18" fill="#f0f7f0" stroke="#c7e0cb" stroke-width="2"/><circle cx="422" cy="320" r="23" fill="#347b51"/><text x="422" y="329" font-size="27" font-weight="bold" text-anchor="middle" fill="white">2</text><text x="458" y="330" font-size="24" font-weight="bold" fill="#1d5338">輕拉下眼瞼</text><g transform="translate(444 332) scale(0.70)"><g transform="translate(35 61)"><path d="M10 111q84-72 182 0-91 69-182 0" fill="#fff" stroke="#4a7960" stroke-width="8"/><circle cx="102" cy="103" r="34" fill="#96cbbc"/><circle cx="102" cy="103" r="19" fill="#336657"/><path d="M56 141q51 39 98 0" fill="none" stroke="#c89174" stroke-width="9"/><path d="M72 172q13-25 33-17" fill="none" stroke="#f0c8a8" stroke-width="18"/></g></g><text x="554" y="544" font-size="18" text-anchor="middle" fill="#47745a">眼膏依處方擠入</text><rect x="42" y="580" width="329" height="277" rx="18" fill="#f0f7f0" stroke="#c7e0cb" stroke-width="2"/><circle cx="75" cy="614" r="23" fill="#347b51"/><text x="75" y="623" font-size="27" font-weight="bold" text-anchor="middle" fill="white">3</text><text x="111" y="624" font-size="24" font-weight="bold" fill="#1d5338">滴入或塗入處方量</text><g transform="translate(97 626) scale(0.70)"><g transform="translate(35 55)"><path d="M12 149q80-63 190 0-88 63-190 0" fill="#fff" stroke="#497761" stroke-width="7"/><circle cx="104" cy="149" r="29" fill="#91cabc"/><g transform="rotate(19 151 58)"><rect x="128" y="20" width="42" height="71" rx="7" fill="#acdce9" stroke="#406f5f" stroke-width="5"/><path d="M138 93h23l-11 25Z" fill="#fff" stroke="#406f5f" stroke-width="4"/></g><path d="M150 131q-13 17 0 26 13-10 0-26" fill="#5cb2d2"/></g></g><text x="207" y="838" font-size="18" text-anchor="middle" fill="#47745a">多種眼藥間隔依醫囑</text><rect x="389" y="580" width="329" height="277" rx="18" fill="#f0f7f0" stroke="#c7e0cb" stroke-width="2"/><circle cx="422" cy="614" r="23" fill="#347b51"/><text x="422" y="623" font-size="27" font-weight="bold" text-anchor="middle" fill="white">4</text><text x="458" y="624" font-size="24" font-weight="bold" fill="#1d5338">閉眼並蓋緊瓶蓋</text><g transform="translate(444 626) scale(0.70)"><g transform="translate(35 60)"><path d="M15 105q86-70 184 0-86 71-184 0" fill="#fff" stroke="#42735c" stroke-width="7"/><path d="M55 105q50 38 105 0" fill="none" stroke="#c58f70" stroke-width="6"/><path d="M111 162q35 21 62-7" fill="none" stroke="#73a78d" stroke-width="9"/><circle cx="193" cy="57" r="26" fill="#e0f1e5"/><path d="M194 42v15l11 8" fill="none" stroke="#478463" stroke-width="5"/></g></g><text x="554" y="838" font-size="18" text-anchor="middle" fill="#47745a">藥水滴入下眼瞼囊</text><rect x="42" y="879" width="676" height="101" rx="14" fill="#fff4df" stroke="#e9d5b2" stroke-width="2"/><text x="61" y="910" font-size="23" font-weight="bold" fill="#805827">安全提醒</text><foreignObject x="60" y="918" width="642" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.4 sans-serif;color:#715634">如有劇烈眼痛、視力突然改變，應盡速就醫。</div></foreignObject></g></svg>