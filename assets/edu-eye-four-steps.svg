<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535"><rect width="1000" height="535" rx="22" fill="#fff"/><rect width="1000" height="84" rx="22" fill="#08786d"/><rect y="61" width="1000" height="28" fill="#08786d"/><circle cx="44" cy="41" r="24" fill="white"/><path d="M44 25 V57 M28 41 H60" stroke="#08786d" stroke-width="7"/><text x="85" y="51" font-size="30" font-weight="bold" fill="white">維元社區藥局　｜　用藥衛教單張</text><text x="20" y="120" font-size="29" font-weight="bold" fill="#174e4b">眼藥水／眼藥膏｜正確使用四步驟</text><g transform="translate(16 134)"><rect width="238" height="284" rx="17" fill="white" stroke="#9fcfcb" stroke-width="2"/><circle cx="25" cy="29" r="20" fill="#087d75"/><text x="25" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="white">1</text><text x="125" y="37" text-anchor="middle" font-size="22" font-weight="bold" fill="#174e4b">洗手確認</text><g transform="translate(36 54)"><g stroke="#116f72" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M45 129 q-4-22 23-22 q7-31 26-29 q20 2 23 30 q26 4 20 25 q-13 24-46 17 q-38 10-46-21Z" fill="#d2f0ed"/><path d="M55 66 L62 50 M110 57 L124 44 M91 37 V23" fill="none"/><circle cx="67" cy="128" r="7" fill="white"/><circle cx="100" cy="123" r="7" fill="white"/></g></g><rect x="12" y="236" width="214" height="39" rx="9" fill="#eaf6f3"/><text x="119" y="262" text-anchor="middle" font-size="18" fill="#275a56">藥名與眼別</text></g><g transform="translate(266 134)"><rect width="238" height="284" rx="17" fill="white" stroke="#9fcfcb" stroke-width="2"/><circle cx="25" cy="29" r="20" fill="#087d75"/><text x="25" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="white">2</text><text x="125" y="37" text-anchor="middle" font-size="22" font-weight="bold" fill="#174e4b">拉下眼瞼</text><g transform="translate(36 54)"><g stroke="#116f72" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M28 103 Q87 38 147 103 Q87 164 28 103Z" fill="#fff"/><circle cx="87" cy="103" r="25" fill="#73b8bd"/><circle cx="87" cy="103" r="12" fill="#235b5e"/><path d="M48 155 Q87 171 128 155" fill="none"/></g></g><rect x="12" y="236" width="214" height="39" rx="9" fill="#eaf6f3"/><text x="119" y="262" text-anchor="middle" font-size="18" fill="#275a56">避免碰眼球</text></g><g transform="translate(516 134)"><rect width="238" height="284" rx="17" fill="white" stroke="#9fcfcb" stroke-width="2"/><circle cx="25" cy="29" r="20" fill="#087d75"/><text x="25" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="white">3</text><text x="125" y="37" text-anchor="middle" font-size="22" font-weight="bold" fill="#174e4b">滴入或塗入</text><g transform="translate(36 54)"><g stroke="#116f72" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M52 47 L106 55 L101 70 L48 63Z" fill="#b9e2e4"/><path d="M108 63 L131 80 L109 94Z" fill="#fff"/><path d="M111 104 q-18 20 0 31 q18-11 0-31Z" fill="#50b3d3"/><path d="M49 147 q34-19 72 2" fill="none"/></g></g><rect x="12" y="236" width="214" height="39" rx="9" fill="#eaf6f3"/><text x="119" y="262" text-anchor="middle" font-size="18" fill="#275a56">依醫囑用量</text></g><g transform="translate(766 134)"><rect width="238" height="284" rx="17" fill="white" stroke="#9fcfcb" stroke-width="2"/><circle cx="25" cy="29" r="20" fill="#087d75"/><text x="25" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="white">4</text><text x="125" y="37" text-anchor="middle" font-size="22" font-weight="bold" fill="#174e4b">閉眼休息</text><g transform="translate(36 54)"><g stroke="#116f72" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M28 103 Q87 38 147 103 Q87 164 28 103Z" fill="#fff"/><circle cx="87" cy="103" r="25" fill="#73b8bd"/><circle cx="87" cy="103" r="12" fill="#235b5e"/><path d="M48 155 Q87 171 128 155" fill="none"/></g></g><rect x="12" y="236" width="214" height="39" rx="9" fill="#eaf6f3"/><text x="119" y="262" text-anchor="middle" font-size="18" fill="#275a56">依指示間隔</text></g><rect x="16" y="435" width="968" height="82" rx="13" fill="#eaf6f3"/><rect x="25" y="445" width="122" height="59" rx="12" fill="#08786d"/><text x="86" y="481" font-size="23" font-weight="bold" text-anchor="middle" fill="white">使用提醒</text><text x="165" y="474" font-size="19" fill="#20534f">滴嘴或管口勿碰眼睛，多種眼藥間隔及順序依藥師指示。</text><text x="165" y="499" font-size="17" fill="#476b68">一般性示意圖，實際操作請依藥袋、仿單及藥師個別指導。</text></svg>