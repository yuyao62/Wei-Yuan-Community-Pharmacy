function setupSettings(){let f=$('#settingsForm');if(!f)return;f.onsubmit=e=>{e.preventDefault();let fields=[F('name',''),F('phone',''),F('line',''),F('hours',''),F('address',''),F('expiryDays','','number'),F('tempMin','','number'),F('tempMax','','number')],r=readForm(f,fields);if(r.line&&!/^https:\/\//i.test(r.line))return toast('LINE 請填 https:// 開頭的完整網址',true);if((r.tempMin===''&&r.tempMax!=='')||(r.tempMax===''&&r.tempMin!==''))return toast('溫度上下限請一併填寫或一併留空',true);if(r.tempMin!==''&&r.tempMin>=r.tempMax)return toast('溫度下限必須小於上限',true);if(update(s=>s.settings=r))toast('設定已儲存')}}

function renderHelp(){return head('使用與 GitHub 上線','先在店內整理商品，再匯出專供顧客瀏覽的頁面。')+`<div class="panel help"><h2>開始使用</h2><ol><li>在「設定與備份」填入藥局名稱、電話、LINE 網址及營業資訊。</li><li>清除示範商品，新增實際商品與照片。各工作模組皆可新增、編輯、搜尋、匯出及列印。</li><li>慢箋每次領藥分筆登記，由藥師確認日期；「下次」可複製資料。通知功能只產生文字，需自行傳送。</li><li>促銷銷售與一般庫存為不同清單。銷售自動扣促銷商品庫存；一般品項庫存請依進貨、盤點結果手動更新。訂貨到貨不會自動入庫。</li><li>每天匯出完整備份；瀏覽器清除資料、無痕模式結束或換網址，都可能讓本機資料無法取得。還原會覆蓋目前資料。</li></ol><h2>GitHub Pages 上線</h2><ol><li>本套件的「顧客公開版」可以上傳 GitHub；公開版不含店內作業資料。</li><li>從促銷管理按「匯出顧客促銷頁」，取得最新 index.html。該檔案已內含商品照片及橫幅。</li><li>在 GitHub 建立儲存庫，例如 pharmacy-promotions，上傳匯出的 index.html。</li><li>進入 Settings → Pages，選擇 Deploy from a branch，再選 main、/ (root) 並儲存。</li><li>往後更換商品或價格，再次匯出 index.html，覆蓋 GitHub 上的同名檔案即可。</li></ol><h2>資料與使用範圍</h2><p>店內版為單一瀏覽器的人工輔助工具，沒有員工登入、雲端資料庫、線上付款或自動通知。多台電腦不會同步。請勿把完整備份放到公開儲存庫；共用電腦請另以作業系統帳號及裝置權限保護。</p><p>組合優惠及滿額折扣限同商品。報價比較需自行統一單位。收支、庫存與現有藥局系統不會自動串接。橫幅為依提供截圖整理的示意圖，實際招牌資訊請以現場為準。</p></div>`}
function download(name,data,type='text/plain;charset=utf-8'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}

function validate(raw){if(!raw||raw.version!==1||!raw.settings||!Array.isArray(raw.products)||!Array.isArray(raw.sales))throw Error('不是支援的藥局備份格式');let base=fresh(),s={version:1,demo:!!raw.demo,settings:{...base.settings}};for(let k of Object.keys(base.settings)){let v=raw.settings[k];if(v!==undefined){if(!['string','number'].includes(typeof v)||String(v).length>400)throw Error('藥局設定格式錯誤');s.settings[k]=v}}if(s.settings.line&&!/^https:\/\//i.test(s.settings.line))throw Error('LINE 網址格式錯誤');for(let k of [...Object.keys(modules),'products','sales']){if(!Array.isArray(raw[k])||raw[k].length>30000)throw Error('資料清單不完整或過大');let ids=new Set();s[k]=raw[k].map(r=>{if(!r||typeof r.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(r.id)||ids.has(r.id))throw Error('紀錄識別碼錯誤或重複');ids.add(r.id);let o={id:r.id},fields=k==='products'?pf:k==='sales'?[F('productId',''),F('name',''),F('qty','','number'),F('amount','','number'),F('date','','date'),F('note','')]:modules[k].fields;for(let f of fields){let v=r[f.key]??'';if(f.type==='number'){if(v!==''&&(typeof v!=='number'||!Number.isFinite(v)||(f.min!==undefined&&v<f.min)||(f.max!==undefined&&v>f.max)))throw Error('數字欄位錯誤')}else{if(typeof v!=='string'||v.length>4000)throw Error('文字欄位錯誤');if(f.type==='select'&&!f.options.includes(v))throw Error('狀態或分類錯誤');if(['date','time'].includes(f.type)&&v&&!new RegExp(f.type==='date'?'^\\d{4}-\\d{2}-\\d{2}$':'^\\d{2}:\\d{2}$').test(v))throw Error('日期或時間錯誤')}if(f.required&&v==='')throw Error('缺少必要欄位');o[f.key]=v}if(k==='products'){let img=r.image||'';if(typeof img!=='string'||img.length>2500000||(img&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(img)))throw Error('商品照片格式錯誤');o.image=img;if(!Number.isInteger(o.stock)||o.stock<0||!Number.isFinite(o.original)||o.original<=0||o.end<o.start)throw Error('促銷數量、價格或日期錯誤');let req=o.offer==='特價'?['price']:o.offer==='第二件優惠'?['second']:o.offer==='任選組合'?['bundleN','bundlePrice']:['threshold','discount'];if(req.some(x=>typeof o[x]!=='number'||!Number.isFinite(o[x])))throw Error('優惠條件不完整');if(o.offer==='任選組合'&&(!Number.isInteger(o.bundleN)||o.bundleN<2))throw Error('組合件數錯誤')}if(k==='sales'){if(!Number.isInteger(o.qty)||o.qty<1||typeof o.amount!=='number'||o.amount<0)throw Error('銷售金額或數量錯誤');o.void=!!r.void}return o})}if(s.sales.some(r=>!s.products.some(p=>p.id===r.productId)))throw Error('銷售紀錄對應的商品不存在');return s}
$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>40*1024*1024)throw Error('備份檔請小於 40 MB');let s=validate(JSON.parse(await f.text()));if(confirm('即將覆蓋目前全部資料。請先備份。確定還原？')){if(storageBroken)storageBroken=false;if(persist(s)){render();toast('完整資料已還原')}}}catch(err){toast('無法還原：'+err.message,true)}e.target.value=''};

let bannerData=BANNER;
function publicData(){let s=state.settings;return {settings:{name:s.name,phone:s.phone,line:s.line,address:s.address,hours:s.hours},demo:state.demo,exported:new Date().toLocaleString('zh-TW'),products:state.products.filter(p=>p.enabled==='上架').map(p=>Object.fromEntries(['id','name','category','spec','original','offer','price','second','bundleN','bundlePrice','threshold','discount','stock','limit','start','end','enabled','description','image'].map(k=>[k,p[k]??''])))}}
function buildCustomerHTML(data,banner){let css=$('style').textContent;let json=JSON.stringify(data).replace(/</g,'\\u003c');let funcs='const esc='+esc.toString()+';const money='+money.toString()+';'+[today,status,offerText,badge,visual,productCards,contactHTML].map(f=>f.toString()).join('\n');let code=`const DATA=${json};const state=DATA;const $=s=>document.querySelector(s);${funcs}\nlet currentCategory='全部';function show(cat=currentCategory){currentCategory=cat;let term=document.getElementById('publicSearch').value.toLowerCase();document.getElementById('publicCards').innerHTML=productCards(DATA.products.filter(p=>status(p)!=='已結束'&&(cat==='全部'||p.category===cat)&&(p.name+p.spec+p.category).toLowerCase().includes(term)));document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat))}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>show(b.dataset.cat));document.getElementById('publicSearch').oninput=()=>show();show();setInterval(()=>{let b=document.querySelector('[data-cat].active');show(b?b.dataset.cat:'全部')},60000);`;return `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(data.settings.name)}｜本期優惠</title><style>${css}</style></head><body><main class="catalog"><div class="catalogbar"><b>＋ ${esc(data.settings.name)}</b>${contactHTML(data.settings)}</div><div class="hero"><img src="${banner||'assets/banner.jpg'}" alt="藥局店面示意"><div class="herotext"><span class="pill">鄰里的日常，安心的陪伴</span><h1>${esc(data.settings.name)}<br>日常好物・本期優惠</h1><p>查看本期商品與活動，到店洽詢選購。</p></div><small class="credit">來源：Google 街景截圖・影像整理示意</small></div>${data.demo?'<div class="notice">示範頁面：商品及價格均為範例，非實際販售資訊。</div>':''}<h2>本期精選優惠</h2><p class="muted">庫存為頁面更新時資訊，實際優惠及數量請向藥局確認。</p><div class="categorytabs">${['全部','保健食品','婦幼用品','生活用品','其他'].map(c=>`<button data-cat="${c}">${c}</button>`).join('')}</div><div class="toolbar"><input id="publicSearch" aria-label="搜尋促銷商品" placeholder="搜尋商品名稱或規格…"></div><div id="publicCards"></div><footer class="catalogfooter">${esc(data.settings.address)}<br>${esc(data.settings.hours)}<br>資料更新：${esc(data.exported)}<br>本頁提供商品活動資訊，洽詢請聯絡藥局。</footer></main><script>${code}${'</scr'+'ipt>'}${'</bo'+'dy>'}</html>`}
async function exportCustomer(){if(!bannerData){try{let r=await fetch('assets/banner.jpg');if(!r.ok)throw Error();let b=await r.blob();bannerData=await new Promise(res=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){toast('橫幅無法嵌入；請連同 assets 資料夾上傳。',true)}}download('index.html',buildCustomerHTML(publicData(),bannerData),'text/html;charset=utf-8')}
window.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!$('#dlg').open){let a=document.activeElement;if(!a||!['INPUT','TEXTAREA','SELECT'].includes(a.tagName))render()}},60000);render();
</script></body></html>
